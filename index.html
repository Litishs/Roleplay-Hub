<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Roleplay Hub</title>
    <script>
        // 首屏防闪：Vue/app.js 加载前同步读 localStorage 缓存的 themeMode + 系统偏好，
        // 立即设 data-theme，避免 body 浅色渲染后再被 watch 改深造成的白闪。
        // 权威值仍由 NativeStorage 持久化，此处仅快速读取缓存。
        (function () {
            try {
                var m = localStorage.getItem('rph_theme_mode') || 'system';
                var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/generated/tailwind.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/vendor/vue.global.prod.js"></script>
    <script src="assets/vendor/marked.umd.js"></script>
    <script src="assets/vendor/purify.min.js"></script>
    <script src="assets/vendor/Sortable.min.js"></script>
    <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans selection:bg-primary-200 selection:text-primary-900">
    <svg aria-hidden="true" style="display: none">
        <symbol id="icon-menu" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </symbol>
        <symbol id="icon-export" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
        </symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </symbol>
        <symbol id="icon-delete" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </symbol>
        <symbol id="icon-star" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118L2.63 10.1c-.783-.57-.38-1.81.588-1.81h4.915a1 1 0 00.95-.69l1.519-4.674z"></path>
        </symbol>
        <symbol id="icon-import" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </symbol>
        <symbol id="icon-arrow-down" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m0 0l-5-5m5 5l5-5"></path>
        </symbol>
        <symbol id="icon-story-branch" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3V13.2C3 14.8802 3 15.7202 3.32698 16.362C3.6146 16.9265 4.07354 17.3854 4.63803 17.673C5.27976 18 6.11984 18 7.8 18H15M15 18C15 19.6569 16.3431 21 18 21C19.6569 21 21 19.6569 21 18C21 16.3431 19.6569 15 18 15C16.3431 15 15 16.3431 15 18ZM3 8L15 8M15 8C15 9.65686 16.3431 11 18 11C19.6569 11 21 9.65685 21 8C21 6.34315 19.6569 5 18 5C16.3431 5 15 6.34315 15 8Z">
            </path>
        </symbol>
    </svg>
    <div class="entry-transition" aria-hidden="true">
        <div class="entry-transition-brand">
            <div class="entry-transition-logo">
                <span class="entry-logo-rp">RP</span>
                <span class="entry-logo-hub">HUB</span>
                <i></i>
            </div>
        </div>
    </div>

    <div id="app" v-cloak class="h-full flex flex-col md:flex-row relative"
        :class="{ 'app-native-fullscreen': isChatFullscreen, 'mobile-keyboard-active': isMobileKeyboardOpen }">
        <component is="style" v-if="settings.fontSize">
            .markdown-body :not(h1):not(h2):not(h3):not(h4):not(h5):not(h6):not(small):not(sub):not(sup):not(code) {
            font-size: inherit !important;
            }
        </component>
        <toast-notification></toast-notification>

        <side-nav></side-nav>

        <div class="app-main flex-1 flex flex-col h-full overflow-hidden bg-gray-50 relative">

            <!-- Chat View -->
            <div v-show="currentView === 'chat'" class="chat-view-root flex flex-col h-full relative">

                <character-info></character-info>

<!-- Chat Header -->
                <div class="absolute top-0 left-0 right-0 z-10 pointer-events-none">
                    <!-- 深色渐隐背景层 (平滑极细过渡) -->
                    <div class="absolute top-0 left-0 right-0 h-28"
                        style="background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.4) 20%, rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.06) 80%, rgba(0,0,0,0.02) 95%, rgba(0,0,0,0) 100%); pointer-events: none;">
                    </div>
                    <!-- 实际内容容器 -->
                    <div class="relative h-12 flex items-center justify-between px-4 pointer-events-auto">
                        <div class="flex items-center min-w-0">
                            <button v-if="!isChatFullscreen" @click="toggleMobileMenu"
                                class="md:hidden mr-3 text-white/80 hover:text-white transition-colors flex-shrink-0">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor"><use href="#icon-menu"></use></svg>
                            </button>
                            <div v-if="currentCharacter" class="flex items-center min-w-0 cursor-pointer"
                                @click="showDescriptionPanel = !showDescriptionPanel">
                                <img :src="currentCharacter?.avatar"
                                    class="w-9 h-9 rounded-full object-cover border border-white/20 shadow-sm flex-shrink-0">
                                <span class="ml-2 font-medium text-white truncate drop-shadow-md">{{
                                    currentCharacter.name }}</span>
                                <button
                                    class="ml-1 p-1.5 text-white/60 hover:text-white hover:bg-white/20 rounded-full transition-all flex-shrink-0"
                                    :class="{'bg-white/20 text-white': showDescriptionPanel}">
                                    <svg class="w-4 h-4 transition-transform duration-300 ease-out"
                                        :class="{'rotate-180': showDescriptionPanel}" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                            </div>
                            <div v-else class="text-white/60 italic drop-shadow-sm">未选择角色卡</div>
                        </div>
                        <div class="flex items-center gap-0">
                            <button @click="toggleChatFullscreen"
                                class="p-1.5 text-white/70 hover:text-white rounded-full hover:bg-white/10 transition-colors"
                                :title="isChatFullscreen ? '退出全屏' : '全屏聊天'">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path v-if="!isChatFullscreen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 4H5a1 1 0 00-1 1v3m12-4h3a1 1 0 011 1v3M4 16v3a1 1 0 001 1h3m8 0h3a1 1 0 001-1v-3">
                                    </path>
                                    <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 4v4a1 1 0 01-1 1H4m11-5v4a1 1 0 001 1h4M9 20v-4a1 1 0 00-1-1H4m11 5v-4a1 1 0 011-1h4">
                                    </path>
                                </svg>
                            </button>
                            <button @click="clearChat"
                                class="p-1.5 text-white/70 hover:text-red-400 rounded-full hover:bg-white/10 transition-colors"
                                title="清空聊天">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor"><use href="#icon-delete"></use></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <message-list></message-list>

                <message-input></message-input>

            </div>

            <!-- Characters Management -->
            <character-panel v-if="currentView === 'characters'"></character-panel>

            <generator-panel v-if="currentView === 'generator'"></generator-panel>

            <square-panel v-if="currentView === 'square'"></square-panel>

            <settings-panel v-if="currentView === 'settings'"></settings-panel>

            <presets-panel v-if="currentView === 'presets'"></presets-panel>

            <ui-template-panel v-if="currentView === 'uitemplates'"></ui-template-panel>

            <regex-panel v-if="currentView === 'regex'"></regex-panel>

            <tools-panel v-if="currentView === 'tools'"></tools-panel>

            <usage-stats-panel v-if="currentView === 'usage'"></usage-stats-panel>

            <memory-panel v-if="currentView === 'memory'"></memory-panel>

            <!-- WorldInfoPanel is always mounted: it hosts shared editor modals
                 (preset/regex/tool/world-info editors, import/export dialogs) used by
                 presets/regex/tools views. Its panel body uses an internal v-if on
                 currentView to avoid rendering when inactive. -->
            <world-info-panel></world-info-panel>

        <!-- Theme-compliant Global Confirm Modal + Confirmation Modal -->
        <confirm-dialog></confirm-dialog>
        <!-- Release Notes Modal (shown when a new version is found) -->
        <release-notes-modal></release-notes-modal>
        <!-- Model Selector / Context Viewer / Story Branch / Author Notice / User Setup Modals -->
        <modal-dialog></modal-dialog>

    </div>
</body>
</html>
