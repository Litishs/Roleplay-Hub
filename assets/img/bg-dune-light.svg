<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="沙丘">
  <!-- 内置界面底图 · 沙丘（浅色）
       暖色低对比场景图：几层沙丘曲线 + 一个低垂的太阳。用作玻璃面的背景，
       刻意不用高饱和度，否则磨砂面会泛出明显的橙。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="0.5" stop-color="#fdfaf5"/>
      <stop offset="1" stop-color="#fefcf8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.28" cy="0.2" r="0.34">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fdf0dc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fdf0dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6d4"/>
      <stop offset="1" stop-color="#eee0cc"/>
    </linearGradient>
    <linearGradient id="duneMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eddfc9"/>
      <stop offset="1" stop-color="#e8d8bf"/>
    </linearGradient>
    <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d6ba"/>
      <stop offset="1" stop-color="#e1cfb0"/>
    </linearGradient>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="750" height="1600" fill="url(#sky)"/>
  <rect width="750" height="900" fill="url(#sun)"/>

  <!-- 三层沙丘：越近越暗、曲线越陡，制造纵深 -->
  <g filter="url(#haze)" opacity="0.8">
    <path d="M0 980 C 180 900, 340 1010, 520 940 S 700 970, 750 930 L 750 1600 L 0 1600 Z" fill="url(#duneFar)"/>
  </g>
  <path d="M0 1130 C 200 1050, 360 1170, 560 1090 S 720 1120, 750 1080 L 750 1600 L 0 1600 Z" fill="url(#duneMid)"/>
  <path d="M0 1330 C 220 1250, 400 1380, 600 1290 S 730 1320, 750 1290 L 750 1600 L 0 1600 Z" fill="url(#duneNear)"/>

  <!-- 风纹：几条极淡的弧线，避免大面积纯色显得平 -->
  <g stroke="#d9c5a4" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M60 1240 C 180 1215, 300 1255, 420 1230"/>
    <path d="M140 1290 C 260 1268, 380 1305, 500 1282"/>
    <path d="M240 1390 C 360 1368, 480 1405, 620 1380"/>
    <path d="M80 1450 C 200 1428, 320 1465, 440 1440"/>
  </g>
</svg>
