<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="极光">
  <!-- 内置界面底图 · 极光（深色）
       与浅色版同一构图，只换取值：深色主题下玻璃色调是 26% 黑，底图必须
       足够暗，玻璃面才不会发亮。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="0.45" stop-color="#141920"/>
      <stop offset="1" stop-color="#171c23"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d3b33" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#1a322d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#141920" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1c2b45" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#1a2637" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#141920" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraC" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#282040" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#141920" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#2a3442" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2a3442" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="softer" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
  </defs>

  <rect width="750" height="1600" fill="url(#sky)"/>

  <g filter="url(#softer)" opacity="0.9">
    <path d="M-60 300 C 160 180, 320 420, 520 260 S 780 340, 820 240 L 820 520 C 760 620, 560 470, 380 600 S 120 520, -60 620 Z" fill="url(#auroraA)"/>
    <path d="M-60 470 C 180 360, 300 600, 500 440 S 760 520, 820 420 L 820 700 C 740 800, 540 640, 360 780 S 100 700, -60 800 Z" fill="url(#auroraB)"/>
  </g>
  <g filter="url(#soft)" opacity="0.7">
    <path d="M-60 640 C 200 560, 340 760, 540 620 S 780 700, 820 610 L 820 830 C 720 900, 520 780, 340 900 S 90 830, -60 920 Z" fill="url(#auroraC)"/>
  </g>

  <rect width="750" height="1600" fill="url(#glow)"/>

  <path d="M0 1180 C 150 1140, 300 1200, 450 1165 S 660 1195, 750 1160 L 750 1600 L 0 1600 Z" fill="#11151b" opacity="0.8"/>
  <path d="M0 1330 C 180 1300, 340 1350, 520 1320 S 700 1345, 750 1320 L 750 1600 L 0 1600 Z" fill="#0e1218" opacity="0.7"/>
</svg>
