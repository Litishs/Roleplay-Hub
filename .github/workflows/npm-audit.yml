name: Dependency audit

# Weekly dependency vulnerability scan; fails only on high severity and above, so medium/low noise never floods PR checks.
#
# Production dependencies only (--omit=dev): the dev toolchain's findings
# (Tailwind 3 -> braces/chokidar/micromatch) are patchable only by a major
# migration, and auditing them would leave this scan permanently red.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above, production dependencies)
        run: npm audit --omit=dev --audit-level=high
