name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: android/app/libs/sherpa-onnx.aar
          key: sherpa-onnx-aar-1.13.5

      - name: Build web assets & vendor
        run: npm run build:web

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          VERSION_CODE=$(( (MAJOR - 1) * 100 + MINOR ))
          cat > android/version.properties << EOF
          versionCode=$VERSION_CODE
          versionName=$TAG
          EOF
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building v$TAG (versionCode=$VERSION_CODE)"

      - name: Create keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will be unsigned (debug-only)"
            mkdir -p android/keystore
            touch android/keystore/roleplay-hub-release.keystore
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/roleplay-hub-release.keystore

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties << EOF
          storeFile=../keystore/roleplay-hub-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Copy APK to root
        run: |
          cp "android/app/build/outputs/apk/release/app-release.apk" \
             "Roleplay-Hub-${{ env.VERSION_NAME }}-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Roleplay-Hub-*-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
